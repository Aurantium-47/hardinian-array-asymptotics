          expected_names = ['Hardinian.FiniteAlgebra.pascalTwoRowSum', 'Hardinian.binomialMass', 'Hardinian.binomialKernel', 'Hardinian.weightedKernelSum', 'Hardinian.FiniteAlgebra.pascalTwoRowSum_cast_square', 'Hardinian.FiniteAlgebra.boundedOffsetEquiv', 'Hardinian.FiniteAlgebra.boundedOffsetEquiv_val', 'Hardinian.FiniteAlgebra.sum_strict_fin_eq_offsets', 'Hardinian.FiniteAlgebra.offset_power_ratio', 'Hardinian.FiniteAlgebra.weightedKernelSum_eq_pascal_square_sum', 'Hardinian.FiniteAlgebra.weightedKernelSum_zero_exact']
