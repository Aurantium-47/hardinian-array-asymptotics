          run(['git', '-C', str(source), 'fetch', '--depth', '1', 'origin', baseline], 'fetch-baseline')
          changed = subprocess.check_output(['git', '-C', str(source), 'diff', '--name-status', baseline, 'HEAD'], text=True).splitlines()
