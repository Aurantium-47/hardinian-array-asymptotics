name: Hardinian single path binomial counting

'on':
  push:
    branches: [codex/hardinian-kernel-spine]
    paths: [lean-kernel/**, .github/workflows/hardinian-kernel-spine.yml]
permissions: {}
concurrency:
  group: hardinian-kernel-spine
  cancel-in-progress: false
jobs:
  kernel:
    if: github.event.repository.private == false && github.repository == 'Aurantium-47/hardinian-array-asymptotics'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      LEAN_NUM_THREADS: '1'
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - name: Fixed setup and path counting under the unchanged bounded guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, signal, subprocess, time
          root = pathlib.Path.cwd()
          output = root / 'audit-logs'
          assert not output.exists()
          output.mkdir()
          env = dict(os.environ)
          build_start = time.monotonic()
          mem = {s.split(':')[0]: int(s.split()[1]) * 1024 for s in pathlib.Path('/proc/meminfo').read_text().splitlines() if s.startswith(('MemTotal:', 'MemAvailable:'))}
          print('RUNNER_RESOURCES', json.dumps(dict(mem, disk_free=shutil.disk_usage('.').free)), flush=True)
          assert mem['MemTotal'] >= 14 * 1024**3 and mem['MemAvailable'] >= 12 * 1024**3
          assert shutil.disk_usage('.').free >= 10 * 1024**3, 'Insufficient disk; do not prune'
          def available():
              return int(re.search(r'^MemAvailable:\s+(\d+)', pathlib.Path('/proc/meminfo').read_text(), re.M)[1]) * 1024
          
          def group_memory(group):
              rss, swap = 0, 0
              for directory in pathlib.Path('/proc').iterdir():
                  if not directory.name.isdigit():
                      continue
                  try:
                      stat = (directory / 'stat').read_text().rsplit(')', 1)[1].split()
                      if int(stat[2]) != group:
                          continue
                      status = (directory / 'status').read_text()
                      for field, amount in re.findall(r'^(VmRSS|VmSwap):\s+(\d+)', status, re.M):
                          if field == 'VmRSS': rss += int(amount) * 1024
                          else: swap += int(amount) * 1024
                  except (FileNotFoundError, ProcessLookupError):
                      continue
              return rss, swap
          
          def stop(group):
              try: os.killpg(group, signal.SIGKILL)
              except ProcessLookupError: pass
          
          def sha(path):
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''): h.update(chunk)
              return h.hexdigest()
          
          def run(args, label, seconds=180):
              assert available() >= 8 * 1024**3, 'Command preflight failed; stop without retry'
              assert time.monotonic() - build_start < 1200, 'Total build budget exhausted'
              log = output / (label + '.log')
              started = time.monotonic()
              record = dict(command=args, peak_group_rss=0, peak_group_swap=0, abort_reason=None)
              print('COMMAND', label, args, flush=True)
              with log.open('xb') as stream:
                  process = subprocess.Popen(args, cwd=root, env=env, stdout=stream, stderr=subprocess.STDOUT, start_new_session=True)
                  try:
                      while process.poll() is None:
                          rss, swap = group_memory(process.pid)
                          record['peak_group_rss'] = max(record['peak_group_rss'], rss)
                          record['peak_group_swap'] = max(record['peak_group_swap'], swap)
                          if rss > 6 * 1024**3: record['abort_reason'] = 'group_rss'
                          elif swap > 512 * 1024**2: record['abort_reason'] = 'group_swap'
                          elif available() < 2 * 1024**3: record['abort_reason'] = 'system_available'
                          elif time.monotonic() - started > seconds: record['abort_reason'] = 'command_time'
                          elif time.monotonic() - build_start > 1200: record['abort_reason'] = 'total_build_time'
                          if record['abort_reason']:
                              stop(process.pid)
                              break
                          time.sleep(0.5)
                  finally:
                      if process.poll() is None: stop(process.pid)
                      record['exit_code'] = process.wait()
                      record['elapsed_seconds'] = time.monotonic() - started
              print(log.read_text(errors='replace'), flush=True)
              print('RESOURCE_RESULT', label, json.dumps(record, sort_keys=True), flush=True)
              print('LOG_SHA256', label, sha(log), flush=True)
              assert record['exit_code'] == 0 and record['abort_reason'] is None, 'Stop; no automatic retry or budget escalation'
              text = log.read_text(errors='replace')
              assert not re.search(r"declaration uses ['`]sorry|\bsorryAx\b", text), 'Unfinished declaration'
              return text
          
          baseline = '45fd0805e05e61f7895123d11a57624db4ff4593'
          expected = {'lean-kernel/Hardinian/BinomialMass.lean': 'fdd93513358abc6fa8c171232379ca22f121fb4065fb3529add61b3d389df34e', 'lean-kernel/Hardinian/KernelError.lean': 'a4e11f5c23f734204703c23a21c0cb44c95544e5808653a73a67ae662e5edf4f', 'lean-kernel/lake-manifest.json': 'e92da7f1c0b34814a1dd9612b7e7acd5975f160e684aa083155a90f508f0c399', 'lean-kernel/lakefile.toml': '0cc96780cc0c6d8becc99ab339c8aefa57035cf12e09f80c18b4d0c977eeb6ab', 'lean-kernel/lean-toolchain': 'f28855f24b5253d7e8949f38027066a06cdde238520086d421ba7ad24c27a691', 'lean-kernel/Hardinian/CentralMassWallis.lean': '642c4c29e14a8bac33596183d9bbf26fbac5c728f2ee13258809650a64a9002b', 'lean-kernel/Hardinian/CentralMassLimit.lean': 'a3bdb565c1de4520b77f2c36d743044fdba2288d401339c14d721cfa1f318607', 'lean-kernel/Hardinian/IntervalKernel.lean': '9d61688ae12ee265af3c961f1882275a9b053bab1079643462d7ad90e8cc32a0', 'lean-kernel/Hardinian/LogWindowRelative.lean': '29776872edda2527d8ff9cbd42607834c4509199c026b510b67b9346abaee62e', 'lean-kernel/Hardinian/UniformCentralScaling.lean': '67986452b742042864337b31aaca46da963fa23c085d70962c377812b6781894', 'lean-kernel/Hardinian/NormalizedKernel.lean': '46d7674cfad068df50adb496bb99f59a6fa115cb526fbef3083238498ac2c94e', 'lean-kernel/Hardinian/KernelGlobalDomination.lean': '29642920e865d53557b441467b48cc5c766044212b86cfcdaca37df6dd2b173f', 'lean-kernel/Hardinian/KernelWeightedLimit.lean': '8297f08bd66cf3850e5cb888d07070b2ce308b7eea46d61dc45f3b589fa73430', 'lean-kernel/Hardinian/ArrayEncoding.lean': '18adbb685d35c9f37b4e1e411107d525073c85b03676192dda6377426da6e4e0', 'lean-kernel/Hardinian/SeparatedCuts.lean': '0bb10b23c4d97205c2802db99a75874dbd6c7fa7a4baa070062b227e9c4767e5', 'lean-kernel/Hardinian/CutPathCore.lean': '5c7c641b0a56491189142b1c08ff0de0ebcee2c5a52813bb4936067c20b38e4f', 'lean-kernel/Hardinian/CutBoundary.lean': '210c78424ed51873b5ad7a314cf809fc36e30cb4af33106d3abc4dea14dd1bc3', 'lean-kernel/Hardinian/GridPathCount.lean': 'de725795a683a9d652044f2ffc9f8bbc2e2977e09166a31785db3eba9b03b65a'}
          own = ['Hardinian.CutPathCore', 'Hardinian.GridPathCount']
          expected_names = ['Hardinian.GridStep', 'Hardinian.IsGridPath', 'Hardinian.GridPath', 'Hardinian.gridPath_rank', 'Hardinian.gridWalk_length_forced', 'Hardinian.zeroGridPath', 'Hardinian.stepPrefixCount', 'Hardinian.stepPrefixCount_zero', 'Hardinian.stepPrefixCount_all', 'Hardinian.stepPrefixCount_le_card', 'Hardinian.stepPrefix_filter_succ_mem', 'Hardinian.stepPrefix_filter_succ_not_mem', 'Hardinian.stepPrefixCount_succ', 'Hardinian.stepPrefixCount_le_index', 'Hardinian.gridPathUpSteps', 'Hardinian.gridPath_up_prefix', 'Hardinian.gridPath_up_prefix_col', 'Hardinian.gridPathUpSteps_card', 'Hardinian.UpStepSet', 'Hardinian.gridPathUpStepSet', 'Hardinian.stepSetVertices', 'Hardinian.stepSetVertices_isPath', 'Hardinian.stepSetPath', 'Hardinian.stepSetPath_upSteps', 'Hardinian.upSteps_stepSetPath', 'Hardinian.gridPathStepPositionsEquiv', 'Hardinian.gridPath_finite', 'Hardinian.gridPath_card', 'Hardinian.gridPath_card_symmetric', 'Hardinian.gridPath_card_zero_left', 'Hardinian.gridPath_card_zero_right']
          workflow = '.github/workflows/hardinian-kernel-spine.yml'
          source = root / 'public-source'
          assert not source.exists()
          run(['git', 'init', str(source)], 'init')
          run(['git', '-C', str(source), 'remote', 'add', 'origin', 'https://github.com/Aurantium-47/hardinian-array-asymptotics.git'], 'origin')
          run(['git', '-C', str(source), 'fetch', '--depth', '1', 'origin', os.environ['CANDIDATE_SHA']], 'fetch-candidate')
          run(['git', '-C', str(source), 'checkout', '--detach', 'FETCH_HEAD'], 'checkout')
          assert subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip() == os.environ['CANDIDATE_SHA']
          run(['git', '-C', str(source), 'fetch', '--depth', '1', 'origin', baseline], 'fetch-baseline')
          changed = subprocess.check_output(['git', '-C', str(source), 'diff', '--name-status', baseline, 'HEAD'], text=True).splitlines()
          assert set(changed) == {'A\t' + p for p in list(expected) + [workflow]}, changed
          assert all(sha(source / p) == h for p, h in expected.items())
          print('CANDIDATE_COMMIT', os.environ['CANDIDATE_SHA'], 'UNCHANGED_RELEASE', baseline, flush=True)
          print('CANDIDATE_SOURCE_HASHES', json.dumps(expected, sort_keys=True), flush=True)
          print('WORKFLOW_SHA256', sha(source / workflow), flush=True)
          archive = root / 'lean-4.19.0-linux.tar.zst'
          run(['curl', '--fail', '--location', '--connect-timeout', '30', '--max-time', '180', 'https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst', '--output', str(archive)], 'download-lean')
          assert sha(archive) == '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe'
          run(['tar', '--zstd', '-xf', str(archive)], 'extract-lean')
          sysroot = root / 'lean-4.19.0-linux'
          lean = str(sysroot / 'bin/lean')
          lake = str(sysroot / 'bin/lake')
          assert sha(pathlib.Path(lean)) == '92c3d35b5bfaa5e0fea413a775d504cf46cd95e1345df61c2274f76779e7e023'
          assert sha(pathlib.Path(lake)) == '5111aee5c9434ab05d4265606475ef22e8bda69aaf3a0657b61a7eec6e550bed'
          env.update(PATH=str(sysroot / 'bin') + os.pathsep + env['PATH'], LEAN_SYSROOT=str(sysroot), LEAN_NUM_THREADS='1', MATHLIB_NO_CACHE_ON_UPDATE='1')
          assert '6caaee842e94' in run([lean, '--version'], 'lean-version')
          root = source / 'lean-kernel'
          assert (root / 'lean-toolchain').read_text().strip() == 'leanprover/lean4:v4.19.0'
          packages = json.loads((root / 'lake-manifest.json').read_text())['packages']
          assert len(packages) == 9
          assert next(p for p in packages if p['name'] == 'mathlib')['rev'] == 'c44e0c8ee63ca166450922a373c7409c5d26b00b'
          for p in packages:
              assert p['type'] == 'git' and p['url'].startswith('https://github.com/')
              target = root / '.lake/packages' / p['name']
              assert not target.exists()
              target.mkdir(parents=True)
              run(['git', 'init', str(target)], p['name'] + '-init')
              run(['git', '-C', str(target), 'remote', 'add', 'origin', p['url']], p['name'] + '-origin')
              run(['git', '-C', str(target), 'fetch', '--depth', '1', 'origin', p['rev']], p['name'] + '-fetch')
              run(['git', '-C', str(target), 'checkout', '--detach', 'FETCH_HEAD'], p['name'] + '-checkout')
              assert subprocess.check_output(['git', '-C', str(target), 'rev-parse', 'HEAD'], text=True).strip() == p['rev']
              print('DEPENDENCY', p['name'], p['rev'], flush=True)
              if p['name'] == 'proofwidgets':
                  run(['git', '-C', str(target), 'fetch', '--depth', '1', 'origin', 'refs/tags/v0.0.57:refs/tags/v0.0.57'], 'proofwidgets-tag')
                  assert subprocess.check_output(['git', '-C', str(target), 'rev-parse', 'v0.0.57^{commit}'], text=True).strip() == p['rev']
          helper = root / '.lake/packages/mathlib/Cache/Requests.lean'
          helper_text = helper.read_text()
          for old in ['IO.FS.removeDirAll (buildDir / "lib")', 'IO.FS.removeDirAll (buildDir / "ir")']:
              assert helper_text.count(old) == 1
              helper_text = helper_text.replace(old, 'pure ()')
          helper.write_text(helper_text)
          assert sha(helper) == '646fed31a48d85ed75746ec09d06c23f5abdaca455518b6760b0dcb2b10c47c0'
          print('CACHE_HELPER_PATCH_SHA256', sha(helper), flush=True)
          print('CACHE_ROOTS', ['Mathlib.Order.Fin.Basic', 'Mathlib.Tactic.NormNum', 'Mathlib.Data.Fintype.Powerset', 'Mathlib.SetTheory.Cardinal.Finite'], flush=True)
          run([lake, 'exe', 'cache', 'get'] + ['Mathlib.Order.Fin.Basic', 'Mathlib.Tactic.NormNum', 'Mathlib.Data.Fintype.Powerset', 'Mathlib.SetTheory.Cardinal.Finite'], 'fixed-import-caches', 900)
          libraries = [root / 'fresh-kernel/lib']
          assert not libraries[0].exists()
          libraries[0].mkdir(parents=True)
          for p in packages:
              package = root / '.lake/packages' / p['name']
              assert subprocess.check_output(['git', '-C', str(package), 'rev-parse', 'HEAD'], text=True).strip() == p['rev']
              status = subprocess.check_output(['git', '-C', str(package), 'status', '--porcelain=v1', '--untracked-files=no'], text=True).strip()
              assert not status or (p['name'] == 'mathlib' and status == 'M Cache/Requests.lean'), status
              library = package / '.lake/build/lib/lean'
              if library.is_dir(): libraries.append(library)
              else: assert p['name'] == 'Cli'
          builtins = sysroot / 'lib/lean'
          for library in libraries[1:] + [builtins]:
              for name in own + ['FreshHardinianAudit']:
                  assert not (library / (name.replace('.', '/') + '.olean')).exists()
          env['LEAN_PATH'] = os.pathsep.join(map(str, libraries))
          flags = ['-j', '1', '-s', '131072', '-DElab.async=false']
          print('LEAN_PATH', env['LEAN_PATH'], 'FLAGS', flags, flush=True)
          for name in own:
              path = root / (name.replace('.', '/') + '.lean')
              assert sha(path) == expected['lean-kernel/' + path.relative_to(root).as_posix()]
              target = libraries[0] / (name.replace('.', '/') + '.olean')
              target.parent.mkdir(parents=True, exist_ok=True)
              run(['/usr/bin/time', '-v', lean] + flags + ['-o', str(target), str(path)], name)
              assert target.is_file()
              print('SOURCE_SHA256', name, sha(path), 'OLEAN_SHA256', sha(target), flush=True)
          probe = root / 'FreshHardinianAudit.lean'
          assert not probe.exists()
          probe.write_text('import Hardinian.CutPathCore\nimport Hardinian.GridPathCount\n\nset_option pp.all true\n#print Hardinian.GridStep\n#print Hardinian.IsGridPath\n#print Hardinian.GridPath\n#print Hardinian.zeroGridPath\n#print Hardinian.stepPrefixCount\n#print Hardinian.gridPathUpSteps\n#print Hardinian.UpStepSet\n#print Hardinian.gridPathUpStepSet\n#print Hardinian.stepSetVertices\n#print Hardinian.stepSetPath\n#print Hardinian.gridPathStepPositionsEquiv\n#check @Hardinian.GridStep\n#print axioms Hardinian.GridStep\n#check @Hardinian.IsGridPath\n#print axioms Hardinian.IsGridPath\n#check @Hardinian.GridPath\n#print axioms Hardinian.GridPath\n#check @Hardinian.gridPath_rank\n#print axioms Hardinian.gridPath_rank\n#check @Hardinian.gridWalk_length_forced\n#print axioms Hardinian.gridWalk_length_forced\n#check @Hardinian.zeroGridPath\n#print axioms Hardinian.zeroGridPath\n#check @Hardinian.stepPrefixCount\n#print axioms Hardinian.stepPrefixCount\n#check @Hardinian.stepPrefixCount_zero\n#print axioms Hardinian.stepPrefixCount_zero\n#check @Hardinian.stepPrefixCount_all\n#print axioms Hardinian.stepPrefixCount_all\n#check @Hardinian.stepPrefixCount_le_card\n#print axioms Hardinian.stepPrefixCount_le_card\n#check @Hardinian.stepPrefix_filter_succ_mem\n#print axioms Hardinian.stepPrefix_filter_succ_mem\n#check @Hardinian.stepPrefix_filter_succ_not_mem\n#print axioms Hardinian.stepPrefix_filter_succ_not_mem\n#check @Hardinian.stepPrefixCount_succ\n#print axioms Hardinian.stepPrefixCount_succ\n#check @Hardinian.stepPrefixCount_le_index\n#print axioms Hardinian.stepPrefixCount_le_index\n#check @Hardinian.gridPathUpSteps\n#print axioms Hardinian.gridPathUpSteps\n#check @Hardinian.gridPath_up_prefix\n#print axioms Hardinian.gridPath_up_prefix\n#check @Hardinian.gridPath_up_prefix_col\n#print axioms Hardinian.gridPath_up_prefix_col\n#check @Hardinian.gridPathUpSteps_card\n#print axioms Hardinian.gridPathUpSteps_card\n#check @Hardinian.UpStepSet\n#print axioms Hardinian.UpStepSet\n#check @Hardinian.gridPathUpStepSet\n#print axioms Hardinian.gridPathUpStepSet\n#check @Hardinian.stepSetVertices\n#print axioms Hardinian.stepSetVertices\n#check @Hardinian.stepSetVertices_isPath\n#print axioms Hardinian.stepSetVertices_isPath\n#check @Hardinian.stepSetPath\n#print axioms Hardinian.stepSetPath\n#check @Hardinian.stepSetPath_upSteps\n#print axioms Hardinian.stepSetPath_upSteps\n#check @Hardinian.upSteps_stepSetPath\n#print axioms Hardinian.upSteps_stepSetPath\n#check @Hardinian.gridPathStepPositionsEquiv\n#print axioms Hardinian.gridPathStepPositionsEquiv\n#check @Hardinian.gridPath_finite\n#print axioms Hardinian.gridPath_finite\n#check @Hardinian.gridPath_card\n#print axioms Hardinian.gridPath_card\n#check @Hardinian.gridPath_card_symmetric\n#print axioms Hardinian.gridPath_card_symmetric\n#check @Hardinian.gridPath_card_zero_left\n#print axioms Hardinian.gridPath_card_zero_left\n#check @Hardinian.gridPath_card_zero_right\n#print axioms Hardinian.gridPath_card_zero_right\n')
          print('PROBE_SHA256', sha(probe), flush=True)
          imports = run([lean, '--deps', str(probe)], 'actual-imports', 60)
          deps = [pathlib.Path(s.strip()).resolve() for s in imports.splitlines() if s.strip()]
          for name in own:
              assert deps.count((libraries[0] / (name.replace('.', '/') + '.olean')).resolve()) == 1
          for path in deps:
              assert path.is_relative_to(libraries[0].resolve()) or path.is_relative_to(builtins.resolve()), path
              print('ACTUAL_IMPORT_SHA256', str(path), sha(path), flush=True)
          audit = run(['/usr/bin/time', '-v', lean] + flags + ['-o', str(libraries[0] / 'FreshHardinianAudit.olean'), str(probe)], 'complete-types-axioms')
          observed = {}
          for name, axioms in re.findall(r"^'([^']+)' depends on axioms: \[([^\]]*)\]", audit, re.M):
              assert name not in observed
              observed[name] = [a.strip() for a in axioms.split(',') if a.strip()]
          for name in re.findall(r"^'([^']+)' does not depend on any axioms", audit, re.M):
              assert name not in observed
              observed[name] = []
          assert set(observed) == set(expected_names)
          assert all(set(a) <= {'propext', 'Classical.choice', 'Quot.sound'} for a in observed.values()), observed
          for name in expected_names:
              assert len(re.findall(r'^@?' + re.escape(name) + r'(?:\s|\.{|\(|\{|\[|:)', audit, re.M)) == 1, name
          print('FINAL_AXIOMS_JSON', json.dumps(observed, sort_keys=True), flush=True)
          assert all(sha(source / p) == h for p, h in expected.items())
          subprocess.run(['git', '-C', str(source), 'diff', '--exit-code', 'HEAD', '--'], check=True)
          assert time.monotonic() - build_start <= 1200
          print('TOTAL_ELAPSED_SECONDS', time.monotonic() - build_start, flush=True)
          print('PASS: one unchanged core dependency and one new fresh module, two direct fresh imports, all new and selected dependency declaration types and transitive axioms verified.', flush=True)
          print('SCOPE: For all natural u and v, actual GridPath u v is equivalent to u-element subsets of Fin(u+v), is finite, and has cardinal choose(u+v,u), including zero endpoints. Full vertex sequences and step sets have proved inverse maps. Families, LGV and actual array-to-kernel counting remain open.', flush=True)
          print('TRUST: fixed external olean caches and the same Lean kernel; no external-source rebuild or independent-kernel replay.', flush=True)
          PY
