              expected_fresh_paths = [(libraries[0] / (m.replace('.', '/') + '.olean')).resolve() for m in expected_project_dependencies]
              observed_fresh_paths = [p for p in dependency_paths if p.is_relative_to(libraries[0].resolve())]
              assert sorted(observed_fresh_paths) == sorted(expected_fresh_paths)
              for dep in dependency_paths:
