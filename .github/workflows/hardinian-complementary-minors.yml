name: Hardinian right-inverse complementary minors

'on':
  push:
    branches: [codex/hardinian-complementary-minors]
    paths: [lean-kernel/**, .github/workflows/hardinian-complementary-minors.yml]
permissions: {}
concurrency:
  group: hardinian-complementary-minors
  cancel-in-progress: false
jobs:
  kernel:
    if: github.event.repository.private == false && github.repository == 'Aurantium-47/hardinian-array-asymptotics'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      LEAN_NUM_THREADS: '1'
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - name: Fixed setup and right-inverse Jacobi under the unchanged bounded guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, signal, subprocess, time
          root = pathlib.Path.cwd()
          output = root / 'audit-logs'
          assert not output.exists()
          output.mkdir()
          env = dict(os.environ)
          build_start = time.monotonic()
          mem = {s.split(':')[0]: int(s.split()[1]) * 1024 for s in pathlib.Path('/proc/meminfo').read_text().splitlines() if s.startswith(('MemTotal:', 'MemAvailable:'))}
          print('RUNNER_RESOURCES', json.dumps(dict(mem, disk_free=shutil.disk_usage('.').free)), flush=True)
          assert mem['MemTotal'] >= 14 * 1024**3 and mem['MemAvailable'] >= 12 * 1024**3
          assert shutil.disk_usage('.').free >= 10 * 1024**3, 'Insufficient disk; do not prune'
          def available():
              return int(re.search(r'^MemAvailable:\s+(\d+)', pathlib.Path('/proc/meminfo').read_text(), re.M)[1]) * 1024

          def group_memory(group):
              rss, swap = 0, 0
              for directory in pathlib.Path('/proc').iterdir():
                  if not directory.name.isdigit():
                      continue
                  try:
                      stat = (directory / 'stat').read_text().rsplit(')', 1)[1].split()
                      if int(stat[2]) != group:
                          continue
                      status = (directory / 'status').read_text()
                      for field, amount in re.findall(r'^(VmRSS|VmSwap):\s+(\d+)', status, re.M):
                          if field == 'VmRSS': rss += int(amount) * 1024
                          else: swap += int(amount) * 1024
                  except (FileNotFoundError, ProcessLookupError):
                      continue
              return rss, swap

          def stop(group):
              try: os.killpg(group, signal.SIGKILL)
              except ProcessLookupError: pass

          def sha(path):
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''): h.update(chunk)
              return h.hexdigest()

          def run(args, label, seconds=180):
              assert available() >= 8 * 1024**3, 'Command preflight failed; stop without retry'
              assert time.monotonic() - build_start < 1200, 'Total build budget exhausted'
              log = output / (label + '.log')
              started = time.monotonic()
              record = dict(command=args, peak_group_rss=0, peak_group_swap=0, abort_reason=None)
              print('COMMAND', label, args, flush=True)
              with log.open('xb') as stream:
                  process = subprocess.Popen(args, cwd=root, env=env, stdout=stream, stderr=subprocess.STDOUT, start_new_session=True)
                  try:
                      while process.poll() is None:
                          rss, swap = group_memory(process.pid)
                          record['peak_group_rss'] = max(record['peak_group_rss'], rss)
                          record['peak_group_swap'] = max(record['peak_group_swap'], swap)
                          if rss > 6 * 1024**3: record['abort_reason'] = 'group_rss'
                          elif swap > 512 * 1024**2: record['abort_reason'] = 'group_swap'
                          elif available() < 2 * 1024**3: record['abort_reason'] = 'system_available'
                          elif time.monotonic() - started > seconds: record['abort_reason'] = 'command_time'
                          elif time.monotonic() - build_start > 1200: record['abort_reason'] = 'total_build_time'
                          if record['abort_reason']:
                              stop(process.pid)
                              break
                          time.sleep(0.5)
                  finally:
                      if process.poll() is None: stop(process.pid)
                      record['exit_code'] = process.wait()
                      record['elapsed_seconds'] = time.monotonic() - started
              print(log.read_text(errors='replace'), flush=True)
              print('RESOURCE_RESULT', label, json.dumps(record, sort_keys=True), flush=True)
              print('LOG_SHA256', label, sha(log), flush=True)
              assert record['exit_code'] == 0 and record['abort_reason'] is None, 'Stop; no automatic retry or budget escalation'
              text = log.read_text(errors='replace')
              assert not re.search(r"declaration uses ['`]sorry|\bsorryAx\b", text), 'Unfinished declaration'
              return text

          baseline = 'c095c30d0c626fd4c1793216290bc2947bcefab3'
          expected = {'lean-kernel/Hardinian/ComplementaryMinorTwo.lean': '019822fb3edf7fbd95b1afc7e9bd963d0b7f8f0a5d78325309e1388bac94544d', 'lean-kernel/Hardinian/ComplementaryJacobiTwo.lean': 'e822af772108c1eb45c4c2869c30b7efe9552aeffce7d0517674a203537d740f'}
          own = ['Hardinian.ComplementaryMinorTwo', 'Hardinian.ComplementaryJacobiTwo']
          expected_names = ['Hardinian.FiniteAlgebra.TwoSet', 'Hardinian.FiniteAlgebra.select₂', 'Hardinian.FiniteAlgebra.select₂_lt', 'Hardinian.FiniteAlgebra.mem_twoSet_iff', 'Hardinian.FiniteAlgebra.two_complement_card', 'Hardinian.FiniteAlgebra.omit₂', 'Hardinian.FiniteAlgebra.indexSum₂', 'Hardinian.FiniteAlgebra.high_ne_zero', 'Hardinian.FiniteAlgebra.highPred', 'Hardinian.FiniteAlgebra.lift_highPred', 'Hardinian.FiniteAlgebra.highPred_val', 'Hardinian.FiniteAlgebra.deleteTwice', 'Hardinian.FiniteAlgebra.deleteTwice_ne_low', 'Hardinian.FiniteAlgebra.deleteTwice_ne_high', 'Hardinian.FiniteAlgebra.deleteTwice_eq_omit', 'Hardinian.FiniteAlgebra.complement₂', 'Hardinian.FiniteAlgebra.replaceTwo', 'Hardinian.FiniteAlgebra.det_of_single_column', 'Hardinian.FiniteAlgebra.replaceTwo_first_column', 'Hardinian.FiniteAlgebra.high_single_after_delete', 'Hardinian.FiniteAlgebra.replaceTwo_second_column', 'Hardinian.FiniteAlgebra.replaceTwo_remaining_matrix', 'Hardinian.FiniteAlgebra.deletion_sign', 'Hardinian.FiniteAlgebra.det_replaceTwo_columns', 'Hardinian.FiniteAlgebra.complement₂_zero', 'Hardinian.FiniteAlgebra.minor₂', 'Hardinian.FiniteAlgebra.coefficientTwo', 'Hardinian.FiniteAlgebra.selector₂', 'Hardinian.FiniteAlgebra.updateDirections₂', 'Hardinian.FiniteAlgebra.coefficientTwo_selected_column', 'Hardinian.FiniteAlgebra.coefficientTwo_other_column', 'Hardinian.FiniteAlgebra.selector₂_selected', 'Hardinian.FiniteAlgebra.selector₂_mul', 'Hardinian.FiniteAlgebra.coefficientTwo_eq_one_add_update', 'Hardinian.FiniteAlgebra.one_add_selector_mul_update', 'Hardinian.FiniteAlgebra.det_coefficientTwo', 'Hardinian.FiniteAlgebra.mul_coefficientTwo', 'Hardinian.FiniteAlgebra.complementary_two_of_right_inverse', 'Hardinian.FiniteAlgebra.complementary_two_of_right_inverse_zero']
          workflow = '.github/workflows/hardinian-complementary-minors.yml'
          protected = {'.github/workflows/hardinian-kernel-spine.yml': '4b024ca16778cae204567932c39041f9be231784efb8c2598d1f20e9fe4ee347', 'AI_USAGE.md': 'd85ef90c62dd44f3a220820ff7df00a350992d7357370e5c1ef5eb714b5bbacf', 'MANIFEST.json': 'd184715fd87f3e7130d270e0618c684ccb7ecc96a8d2c33c9e7accb7f0112bf3', 'README.md': '9296ad5031c016de8083251518d01c4a13cdb6fdbec461ecac100288358a3604', 'README.zh-CN.md': 'bf1810edca376860db76ebac7e9c301d083fa89a374371101bc8cf2d932a66ef', 'REFERENCES.md': '8d03be451e97553ad0b18895966490d17b1e6fc6551cfcbbbd6d7e1ac602edaf', 'REPRODUCIBILITY.md': '02f28204cb7abdd82b2fb7af5b40709a72da423f4705a29acd3eddbbaa915680', 'RIGHTS.md': 'fed3050997e15c6d3b72eb686b21af5cf51f4f5b2da3c3d214ff2d9f7d56fbe2', 'SCOPE.md': '9aff516b87c378938cbcc6c38db33add610771731675d212224b8b50bd21846b', 'SHA256SUMS.txt': '5e87602f2c54b1627a8599a1df4021cb6775edd1f203e14843ae580b22c53903', 'WHITELIST.txt': '0a2f0cc8d299558070b25813a27dd898e32b9642cd5681093c9674ab2fb83294', 'extensions/paper/proof.pdf': '5f26ac0a52247d9871203d4d1dc3d481f99b6a58aafc8857071a28f67e240476', 'extensions/paper/proof.tex': 'e6ea761e083415de7c36df7dc06ca76c0257d2f6401e91cbff16adced81e7610', 'hardinian.py': 'a6335543b9846aae3f18e113ce2e52a661e6c1c97301e5e5b62b899f5f45f753', 'hardinian_results.json': 'ad6c3e1dc81956cff930fcaf405e6b47be64a9e49c4b0e7c5b3ef7821a41929d', 'lean-kernel/Hardinian/BinomialMass.lean': 'fdd93513358abc6fa8c171232379ca22f121fb4065fb3529add61b3d389df34e', 'lean-kernel/Hardinian/CentralMassLimit.lean': 'a3bdb565c1de4520b77f2c36d743044fdba2288d401339c14d721cfa1f318607', 'lean-kernel/Hardinian/CentralMassWallis.lean': '642c4c29e14a8bac33596183d9bbf26fbac5c728f2ee13258809650a64a9002b', 'lean-kernel/Hardinian/ComplementaryMinorTwo.lean': '019822fb3edf7fbd95b1afc7e9bd963d0b7f8f0a5d78325309e1388bac94544d', 'lean-kernel/Hardinian/IntervalKernel.lean': '9d61688ae12ee265af3c961f1882275a9b053bab1079643462d7ad90e8cc32a0', 'lean-kernel/Hardinian/KernelError.lean': 'a4e11f5c23f734204703c23a21c0cb44c95544e5808653a73a67ae662e5edf4f', 'lean-kernel/Hardinian/KernelGlobalDomination.lean': '29642920e865d53557b441467b48cc5c766044212b86cfcdaca37df6dd2b173f', 'lean-kernel/Hardinian/KernelWeightedLimit.lean': '8297f08bd66cf3850e5cb888d07070b2ce308b7eea46d61dc45f3b589fa73430', 'lean-kernel/Hardinian/LogWindowRelative.lean': '29776872edda2527d8ff9cbd42607834c4509199c026b510b67b9346abaee62e', 'lean-kernel/Hardinian/NormalizedKernel.lean': '46d7674cfad068df50adb496bb99f59a6fa115cb526fbef3083238498ac2c94e', 'lean-kernel/Hardinian/UniformCentralScaling.lean': '67986452b742042864337b31aaca46da963fa23c085d70962c377812b6781894', 'lean-kernel/lake-manifest.json': 'e92da7f1c0b34814a1dd9612b7e7acd5975f160e684aa083155a90f508f0c399', 'lean-kernel/lakefile.toml': '0cc96780cc0c6d8becc99ab339c8aefa57035cf12e09f80c18b4d0c977eeb6ab', 'lean-kernel/lean-toolchain': 'f28855f24b5253d7e8949f38027066a06cdde238520086d421ba7ad24c27a691', 'main.pdf': 'b323ddd9482e3e8df3d2fba42c168b6929db28a4e7ed7d0e37cd70762a54b11f', 'main.tex': '3f56b2306d89e0f2ea9d0394fdb6261d2f39a2bed1f198cea187966c1022af1a'}
          source = root / 'public-source'
          assert not source.exists()
          run(['git', 'init', str(source)], 'init')
          run(['git', '-C', str(source), 'remote', 'add', 'origin', 'https://github.com/Aurantium-47/hardinian-array-asymptotics.git'], 'origin')
          run(['git', '-C', str(source), 'fetch', '--depth', '1', 'origin', os.environ['CANDIDATE_SHA']], 'fetch-candidate')
          run(['git', '-C', str(source), 'checkout', '--detach', 'FETCH_HEAD'], 'checkout')
          assert subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip() == os.environ['CANDIDATE_SHA']
          run(['git', '-C', str(source), 'fetch', '--depth', '1', 'origin', baseline], 'fetch-baseline')
          changed = subprocess.check_output(['git', '-C', str(source), 'diff', '--name-status', baseline, 'HEAD'], text=True).splitlines()
          assert set(changed) == {'A\t'+'lean-kernel/Hardinian/ComplementaryJacobiTwo.lean', 'M\t'+workflow}, changed
          assert all(sha(source / p) == h for p, h in expected.items())
          assert all(sha(source / p) == h for p, h in protected.items())
          print('CANDIDATE_COMMIT', os.environ['CANDIDATE_SHA'], 'PROTECTED_BASE', baseline, flush=True)
          print('CANDIDATE_TREE', run(['git', '-C', str(source), 'rev-parse', 'HEAD^{tree}'], 'tree').strip(), flush=True)
          print('PROTECTED_BASE_HASHES', json.dumps(protected, sort_keys=True), flush=True)
          print('CANDIDATE_SOURCE_HASHES', json.dumps(expected, sort_keys=True), flush=True)
          print('WORKFLOW_SHA256', sha(source / workflow), flush=True)
          archive = root / 'lean-4.19.0-linux.tar.zst'
          run(['curl', '--fail', '--location', '--connect-timeout', '30', '--max-time', '180', 'https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst', '--output', str(archive)], 'download-lean')
          assert sha(archive) == '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe'
          run(['tar', '--zstd', '-xf', str(archive)], 'extract-lean')
          sysroot = root / 'lean-4.19.0-linux'
          lean = str(sysroot / 'bin/lean')
          lake = str(sysroot / 'bin/lake')
          assert sha(pathlib.Path(lean)) == '92c3d35b5bfaa5e0fea413a775d504cf46cd95e1345df61c2274f76779e7e023'
          assert sha(pathlib.Path(lake)) == '5111aee5c9434ab05d4265606475ef22e8bda69aaf3a0657b61a7eec6e550bed'
          env.update(PATH=str(sysroot / 'bin') + os.pathsep + env['PATH'], LEAN_SYSROOT=str(sysroot), LEAN_NUM_THREADS='1', MATHLIB_NO_CACHE_ON_UPDATE='1')
          assert '6caaee842e94' in run([lean, '--version'], 'lean-version')
          root = source / 'lean-kernel'
          assert (root / 'lean-toolchain').read_text().strip() == 'leanprover/lean4:v4.19.0'
          packages = json.loads((root / 'lake-manifest.json').read_text())['packages']
          assert len(packages) == 9
          assert next(p for p in packages if p['name'] == 'mathlib')['rev'] == 'c44e0c8ee63ca166450922a373c7409c5d26b00b'
          for p in packages:
              assert p['type'] == 'git' and p['url'].startswith('https://github.com/')
              target = root / '.lake/packages' / p['name']
              assert not target.exists()
              target.mkdir(parents=True)
              run(['git', 'init', str(target)], p['name'] + '-init')
              run(['git', '-C', str(target), 'remote', 'add', 'origin', p['url']], p['name'] + '-origin')
              run(['git', '-C', str(target), 'fetch', '--depth', '1', 'origin', p['rev']], p['name'] + '-fetch')
              run(['git', '-C', str(target), 'checkout', '--detach', 'FETCH_HEAD'], p['name'] + '-checkout')
              assert subprocess.check_output(['git', '-C', str(target), 'rev-parse', 'HEAD'], text=True).strip() == p['rev']
              print('DEPENDENCY', p['name'], p['rev'], flush=True)
              if p['name'] == 'proofwidgets':
                  run(['git', '-C', str(target), 'fetch', '--depth', '1', 'origin', 'refs/tags/v0.0.57:refs/tags/v0.0.57'], 'proofwidgets-tag')
                  assert subprocess.check_output(['git', '-C', str(target), 'rev-parse', 'v0.0.57^{commit}'], text=True).strip() == p['rev']
          helper = root / '.lake/packages/mathlib/Cache/Requests.lean'
          helper_text = helper.read_text()
          for old in ['IO.FS.removeDirAll (buildDir / "lib")', 'IO.FS.removeDirAll (buildDir / "ir")']:
              assert helper_text.count(old) == 1
              helper_text = helper_text.replace(old, 'pure ()')
          helper.write_text(helper_text)
          assert sha(helper) == '646fed31a48d85ed75746ec09d06c23f5abdaca455518b6760b0dcb2b10c47c0'
          print('CACHE_HELPER_PATCH_SHA256', sha(helper), flush=True)
          print('CACHE_ROOTS', ['Mathlib.LinearAlgebra.Matrix.Determinant.Basic', 'Mathlib.Data.Finset.Sort', 'Mathlib.Data.Fintype.Card', 'Mathlib.Order.Fin.Basic', 'Mathlib.Tactic.FinCases', 'Mathlib.Tactic.NormNum', 'Mathlib.LinearAlgebra.Matrix.SchurComplement', 'Mathlib.Algebra.BigOperators.Fin', 'Mathlib.Tactic.Ring'], flush=True)
          run([lake, 'exe', 'cache', 'get'] + ['Mathlib.LinearAlgebra.Matrix.Determinant.Basic', 'Mathlib.Data.Finset.Sort', 'Mathlib.Data.Fintype.Card', 'Mathlib.Order.Fin.Basic', 'Mathlib.Tactic.FinCases', 'Mathlib.Tactic.NormNum', 'Mathlib.LinearAlgebra.Matrix.SchurComplement', 'Mathlib.Algebra.BigOperators.Fin', 'Mathlib.Tactic.Ring'], 'fixed-import-caches', 900)
          libraries = [root / 'fresh-complementary/lib']
          assert not libraries[0].exists()
          libraries[0].mkdir(parents=True)
          for p in packages:
              package = root / '.lake/packages' / p['name']
              assert subprocess.check_output(['git', '-C', str(package), 'rev-parse', 'HEAD'], text=True).strip() == p['rev']
              status = subprocess.check_output(['git', '-C', str(package), 'status', '--porcelain=v1', '--untracked-files=no'], text=True).strip()
              assert not status or (p['name'] == 'mathlib' and status == 'M Cache/Requests.lean'), status
              library = package / '.lake/build/lib/lean'
              if library.is_dir(): libraries.append(library)
              else: assert p['name'] == 'Cli'
          builtins = sysroot / 'lib/lean'
          for library in libraries[1:] + [builtins]:
              for name in own + ['FreshComplementaryAudit']:
                  assert not (library / (name.replace('.', '/') + '.olean')).exists()
          env['LEAN_PATH'] = os.pathsep.join(map(str, libraries))
          flags = ['-j', '1', '-s', '131072', '-DElab.async=false']
          print('LEAN_PATH', env['LEAN_PATH'], 'FLAGS', flags, flush=True)
          for name in own:
              path = root / (name.replace('.', '/') + '.lean')
              assert sha(path) == expected['lean-kernel/' + path.relative_to(root).as_posix()]
              target = libraries[0] / (name.replace('.', '/') + '.olean')
              target.parent.mkdir(parents=True, exist_ok=True)
              module_deps = run([lean, '--deps', str(path)], name + '-imports', 60)
