          expected = {'lean-kernel/Hardinian/CutPathCore.lean': '5c7c641b0a56491189142b1c08ff0de0ebcee2c5a52813bb4936067c20b38e4f', 'lean-kernel/Hardinian/GeneralCutBoundary.lean': 'ed53eeb9d54ffd8a969a2cf7e9f07930b883daafae7c244f6211c1d8cf3a46e7'}
