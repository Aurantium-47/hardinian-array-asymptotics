name: Hardinian original r2 asymptotic assembly

'on':
  push:
    branches: [codex/hardinian-r2-final-assembly]
    paths: [lean-kernel/**, .github/workflows/hardinian-r2-final-assembly.yml]
permissions: {}
concurrency:
  group: hardinian-r2-final-assembly
  cancel-in-progress: false
jobs:
  kernel:
    if: github.event.repository.private == false && github.repository == 'Aurantium-47/hardinian-array-asymptotics'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      LEAN_NUM_THREADS: '1'
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - name: Fixed setup and original r2 asymptotic assembly under the unchanged bounded guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, signal, subprocess, time
          root = pathlib.Path.cwd()
          output = root / 'audit-logs'
          assert not output.exists()
          output.mkdir()
          env = dict(os.environ)
          build_start = time.monotonic()
          mem = {s.split(':')[0]: int(s.split()[1]) * 1024 for s in pathlib.Path('/proc/meminfo').read_text().splitlines() if s.startswith(('MemTotal:', 'MemAvailable:'))}
          print('RUNNER_RESOURCES', json.dumps(dict(mem, disk_free=shutil.disk_usage('.').free)), flush=True)
          assert mem['MemTotal'] >= 14 * 1024**3 and mem['MemAvailable'] >= 12 * 1024**3
          assert shutil.disk_usage('.').free >= 10 * 1024**3, 'Insufficient disk; do not prune'
          def available():
              return int(re.search(r'^MemAvailable:\s+(\d+)', pathlib.Path('/proc/meminfo').read_text(), re.M)[1]) * 1024

          def group_memory(group):
              rss, swap = 0, 0
              for directory in pathlib.Path('/proc').iterdir():
                  if not directory.name.isdigit():
                      continue
                  try:
                      stat = (directory / 'stat').read_text().rsplit(')', 1)[1].split()
                      if int(stat[2]) != group:
                          continue
                      status = (directory / 'status').read_text()
                      for field, amount in re.findall(r'^(VmRSS|VmSwap):\s+(\d+)', status, re.M):
                          if field == 'VmRSS': rss += int(amount) * 1024
                          else: swap += int(amount) * 1024
                  except (FileNotFoundError, ProcessLookupError):
                      continue
              return rss, swap

          def stop(group):
              try: os.killpg(group, signal.SIGKILL)
              except ProcessLookupError: pass

          def sha(path):
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''): h.update(chunk)
              return h.hexdigest()

          def run(args, label, seconds=180):
              assert available() >= 8 * 1024**3, 'Command preflight failed; stop without retry'
              assert time.monotonic() - build_start < 1200, 'Total build budget exhausted'
              log = output / (label + '.log')
              started = time.monotonic()
              record = dict(command=args, peak_group_rss=0, peak_group_swap=0, abort_reason=None)
              print('COMMAND', label, args, flush=True)
              with log.open('xb') as stream:
                  process = subprocess.Popen(args, cwd=root, env=env, stdout=stream, stderr=subprocess.STDOUT, start_new_session=True)
                  try:
                      while process.poll() is None:
                          rss, swap = group_memory(process.pid)
                          record['peak_group_rss'] = max(record['peak_group_rss'], rss)
                          record['peak_group_swap'] = max(record['peak_group_swap'], swap)
                          if rss > 6 * 1024**3: record['abort_reason'] = 'group_rss'
                          elif swap > 512 * 1024**2: record['abort_reason'] = 'group_swap'
                          elif available() < 2 * 1024**3: record['abort_reason'] = 'system_available'
                          elif time.monotonic() - started > seconds: record['abort_reason'] = 'command_time'
                          elif time.monotonic() - build_start > 1200: record['abort_reason'] = 'total_build_time'
                          if record['abort_reason']:
                              stop(process.pid)
                              break
                          time.sleep(0.5)
                  finally:
                      if process.poll() is None: stop(process.pid)
                      record['exit_code'] = process.wait()
                      record['elapsed_seconds'] = time.monotonic() - started
              print(log.read_text(errors='replace'), flush=True)
              print('RESOURCE_RESULT', label, json.dumps(record, sort_keys=True), flush=True)
              print('LOG_SHA256', label, sha(log), flush=True)
              assert record['exit_code'] == 0 and record['abort_reason'] is None, 'Stop; no automatic retry or budget escalation'
              text = log.read_text(errors='replace')
              assert not re.search(r"declaration uses ['`]sorry|\bsorryAx\b", text), 'Unfinished declaration'
              return text

