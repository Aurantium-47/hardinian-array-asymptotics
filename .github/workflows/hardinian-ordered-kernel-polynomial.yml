              assert name == end and name not in observed and mod in own
              starts = re.findall(r'^DYNAMIC_TYPE_BEGIN\|([^\n]+)$', body, re.M)
              stops = re.findall(r'^DYNAMIC_TYPE_END\|([^\n]+)$', body, re.M)
              assert starts == stops == [name]
              actual_type = body.split('DYNAMIC_TYPE_BEGIN|' + name + '\n', 1)[1].split('\nDYNAMIC_TYPE_END|' + name, 1)[0]
              assert actual_type.strip()
              axioms = re.findall(r'^DYNAMIC_AXIOMS\|' + re.escape(name) + r'\|([^\n]*)$', body, re.M)
              assert len(axioms) == 1
              observed[name] = [a for a in axioms[0].split(',') if a]
              assert set(observed[name]) <= {'propext', 'Classical.choice', 'Quot.sound'}
              safety = re.findall(r'^DYNAMIC_SAFETY\|' + re.escape(name) + r'\|([^\n]*)$', body, re.M)
              assert safety == ['false|false'], (name, safety)
              bodies = re.findall(r'^DYNAMIC_BODY_BEGIN\|([^\n]+)$', body, re.M)
              endings = re.findall(r'^DYNAMIC_BODY_END\|([^\n]+)$', body, re.M)
              assert bodies == endings == ([name] if kind in ['def', 'opaque'] else [])
              if bodies:
